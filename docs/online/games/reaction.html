<script>
var pad=document.getElementById('pad'),start=document.getElementById('start'),out=document.getElementById('out'),bestEl=document.getElementById('best');
var round=0,times=[],t0=0,timer=null,state='idle';
function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rank(ms){if(ms<220)return'GAMER REFLEXES';if(ms<280)return'SHARP';if(ms<350)return'AVERAGE HUMAN';return'HALF ASLEEP'}
function showBest(){var b=get('rx_best',null);bestEl.textContent=b?('Your best average: '+b+' ms — beat it.'):'No best yet. Set one.'}
function bumpPlays(){var p=get('rx_plays',0)+1;set('rx_plays',p);document.getElementById('plays').textContent=p+(p===1?' play':' plays')+' on this device'}
function copyScore(){var b=get('rx_best',null),t=b?('My reaction average is '+b+' ms. Beat me: https://raycast.in/online/games/reaction.html'):'Reaction Test: https://raycast.in/online/games/reaction.html';if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('Copied — paste anywhere.')});else prompt('Copy:',t)}
function arm(){state='wait';pad.className='pad wait';pad.textContent='Wait for GREEN… ('+(round+1)+'/5)';var delay=1500+Math.random()*2500;timer=setTimeout(function(){state='go';pad.className='pad go';pad.textContent='TAP!';t0=Date.now()},delay)}
pad.onclick=function(){if(state==='wait'){clearTimeout(timer);state='idle';pad.className='pad';pad.textContent='FOUL — too early. Tap START.';out.innerHTML='';start.style.display='inline-block';return}if(state==='go'){var ms=Date.now()-t0;times.push(ms);state='idle';pad.className='pad';if(round<4){round++;out.innerHTML='<div class="score">'+ms+' ms</div><div class="rank">'+rank(ms)+'</div>';arm()}else{var avg=Math.round(times.reduce(function(a,b){return a+b},0)/5);var prev=get('rx_best',null);var tag=(prev===null||avg<prev)?'NEW BEST!':'Best stays '+prev+' ms';if(prev===null||avg<prev)set('rx_best',avg);out.innerHTML='<div class="score">'+avg+' ms avg</div><div class="rank">'+rank(avg)+' — '+tag+'</div><p><button class="btn" onclick="location.reload()">PLAY AGAIN</button></p>';pad.textContent='Done. '+avg+' ms average.';start.style.display='none'}}};
start.onclick=function(){round=0;times=[];out.innerHTML='';start.style.display='none';arm()};
showBest();bumpPlays();
</script>
